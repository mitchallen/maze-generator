version: 2
# @mitchallen/* packages live on GitHub Packages. Dependabot reads them with its
# own GITHUB_TOKEN (the same access GitHub Actions has), so no personal access
# token or registries entry is needed; the committed .npmrc maps the scope.
updates:
  # Keep the dev toolchain's lockfile current so patched transitive versions
  # land before an advisory fires.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
